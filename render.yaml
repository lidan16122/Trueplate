# Render Blueprint for the Trueplate API. Blueprints are only read from the repo
# root, which is why this sits beside CLAUDE.md rather than in server/.
#
# There is deliberately no `databases:` block. Postgres and Redis stay on Neon and
# Upstash: Render's free Postgres expires 30 days after creation and is then
# deleted, and their free Key Value holds data in memory only — so every restart
# would drop the refresh-token families and silently sign out every user.
services:
  - type: web
    name: trueplate-api
    runtime: docker
    plan: free
    # Pick the region nearest the Neon instance — every request pays this hop.
    region: frankfurt

    # With rootDir set, dockerfilePath and dockerContext resolve relative to it
    # rather than to the repo root. rootDir also means a client-only commit never
    # triggers a build here.
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # /health, deliberately not /health/ready. Liveness touches no dependency and
    # always returns 200; readiness returns 503 whenever Neon or Upstash is cold,
    # and pointing a health check at that means Render restarts a healthy app
    # because a free-tier database took a moment to wake.
    healthCheckPath: /health

    # Deploy only once every GitHub check on the commit has passed. Render skips
    # the deploy entirely if one fails, or if no checks are detected at all.
    autoDeployTrigger: checksPass

    envVars:
      # sync: false — set once in the dashboard, never stored in this repo.
      #
      # DATABASE_URL needs the `postgresql+psycopg://` scheme. Neon hands out
      # `postgresql://`, and pasting that unchanged does not raise: SQLAlchemy
      # quietly selects the sync driver and every request blocks the event loop.
      # Keep the `?sslmode=require` Neon appends. REDIS_URL wants `rediss://` for
      # Upstash's TLS port.
      #
      # JWT_SECRET_KEY must be at least 32 characters. The process refuses to boot
      # without it, which is deliberate — a deploy that forgets it must fail rather
      # than sign real tokens with something weak.
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: USDA_FDC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Not a secret, but still dashboard-set: a literal `value:` here would bake
      # this deploy's hostname into the repo, where it is wrong for anyone who
      # forks it or renames the service. It must match the Console entry exactly.
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # The defaults assume a local Postgres that answers instantly. A free-tier
      # Neon or Upstash scaling to zero pays a cold start on the first request
      # after idle, and the tight defaults read that as an outage. Values from
      # .env.example:104-107.
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "15"
      - key: DB_STATEMENT_TIMEOUT_SECONDS
        value: "30"
      - key: REDIS_TIMEOUT_SECONDS
        value: "10"
      - key: HEALTH_CHECK_TIMEOUT_SECONDS
        value: "20.0"
