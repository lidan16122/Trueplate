services:
  postgres:
    image: postgres:17-alpine
    container_name: trueplate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trueplate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trueplate}
      POSTGRES_DB: ${POSTGRES_DB:-trueplate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trueplate} -d ${POSTGRES_DB:-trueplate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: trueplate-redis
    restart: unless-stopped
    # Persist so refresh-token families survive a container restart in dev.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
